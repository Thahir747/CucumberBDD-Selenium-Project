status = error
name = PropertiesConfig

# Console Appender
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1} - %m%n

# Rolling File Appender (creates ./log/testlog.log automatically)
appender.file.type = RollingFile
appender.file.name = FileAppender
appender.file.fileName = log/testlog.log
appender.file.filePattern = log/testlog-%d{yyyy-MM-dd}-%i.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1} - %m%n
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 5

# Application Log Appender (creates ./log/application.log automatically)
appender.appFile.type = RollingFile
appender.appFile.name = AppLogFile
appender.appFile.fileName = log/application.log
appender.appFile.filePattern = log/application-%d{yyyy-MM-dd}-%i.log
appender.appFile.layout.type = PatternLayout
appender.appFile.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p [%t] (%F:%L) - %m%n
appender.appFile.policies.type = Policies
appender.appFile.policies.size.type = SizeBasedTriggeringPolicy
appender.appFile.policies.size.size = 10MB
appender.appFile.strategy.type = DefaultRolloverStrategy
appender.appFile.strategy.max = 5

# Application HTML Log Appender (creates ./log/application.html automatically)
appender.htmlFile.type = File
appender.htmlFile.name = HtmlAppLog
appender.htmlFile.fileName = log/application.html
appender.htmlFile.layout.type = HtmlLayout
appender.htmlFile.layout.title = Application Execution Log
appender.htmlFile.layout.locationInfo = true

# Root Logger
rootLogger.level = info
rootLogger.appenderRefs = stdout, file, appFile, htmlFile
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.file.ref = FileAppender
rootLogger.appenderRef.appFile.ref = AppLogFile
rootLogger.appenderRef.htmlFile.ref = HtmlAppLog